# GAN-style three-role self-evolution framework - loop / reward / gating config
# NOTE: every key below MUST have a code consumer (cfg.get(...)); design-only
# statements live in AGENTS.md / docs, not here (see docs/6_v5改动.md R2).
# Exception retired (docs/10 §9): the ``cost.*`` section now HAS consumers
# (record_usage -> runtime ledger + statements; token_budget_per_gen ->
# statement reference line); clamping consumption remains stage C.

# ---------------------------------------------------------------------------
# 双循环调度
# ---------------------------------------------------------------------------
loop:
  outer_generations: 2          # G: number of meta-level (outer) generations
  inner_max: 3                  # I_max: max inner iterations per outer generation
  stagnation_patience: 2        # S_in: consecutive non-improving inner iters -> break
  stagnation_epsilon: 0.005     # delta score threshold
  keep_workdirs: false          # false: delete work/<genid> after each generation (space)
  self_improve_max_tool_calls: 5  # tool-call budget for role self-improvement
  plan_max_tool_calls: 6          # tool-call budget for the PLAN seat (planner only;
                                   # the evaluate seat has its own key below -- it must
                                   # at minimum complete its mandatory eval-points)
  evaluate_max_tool_calls: 8      # tool-call budget for the EVALUATE seat (blind phase;
                                   # the reveal phase gets a third of it, min 6). Must
                                   # cover: eval-points sweep + record/report/judge_fix.
  tool_repeat_limit: 3             # anti-thrash: >= this many CONSECUTIVE identical
                                   # (tool, input, output) calls ends the session (event
                                   # tool_repeat_break). Each tool's first call is exempt,
                                   # so mandatory eval-points always complete. 0 disables.
  patch_retry_k: 2                 # in-session retries when a produced patch is rejected
  toolset_preflight: true          # validate registry/toolset integrity at startup (fail-fast;
                                   # pure local check, no model calls). false = log-only.
  tool_call_timeout_s: 600         # C batch: per-CALL tool budget in seconds (dispatch net in
                                   # agent.llm_withtools; a wedged call is abandoned + breaker,
                                   # not a hung session). Task child uses its own constant.
  llm_client_timeout_s: 600       # per-LLM-call client budget (agent/llm.py via GAN_LLM_TIMEOUT_S;
                                   # explicit: litellm's implicit default is silent). MUST stay
                                   # <= llm_proxy_timeout_s so the proxy is never the first to
                                   # cut a healthy in-flight call.
  llm_proxy_timeout_s: 700        # proxy upstream budget (gan/framework/llm_proxy ParentLLMProxy;
                                   # consumer: gan/driver.py). Reasoning models take 150-350s per
                                   # long call (observed), so this must sit above the client.
  question_timeout_s: 300         # DEFAULT per-question wall budget (domains/harness.py
                                   # QUESTION_TIMEOUT via GAN_QUESTION_TIMEOUT_S; consumers:
                                   # task_runner env + harness-total scaling). domains.yaml
                                   # overrides per domain.
  trajectory_expose_reasoning: true
                                   # trajectories ONLY (read_trajectory, role="task");
                                   # role sessions (read_session_trajectory, incl. its
                                   # legacy per-gen fallback) NEVER expose reasoning
                                   # regardless of this flag. The task agent's (already
                                   # line-redacted) reasoning text is rendered into the
                                   # read() output when true; false restores
                                   # "[reasoning omitted: N chars]". Default on since the
                                   # short-answer domains (search_arena): a one-word
                                   # verdict carries too little signal for the
                                   # planner/evaluator to reason about WHAT failed.
                                   # Persuasion note (B29 spirit): raw CoT may speculate
                                   # about benchmark mechanics — the evaluator's
                                   # reward_hacking / rule_violation checkpoints are the
                                   # backstop.

# ---------------------------------------------------------------------------
# task 树/DAG 约束与父代选择
# ---------------------------------------------------------------------------
tree:
  branch_limit: 2               # B: max children per node
  depth_limit: 5                # D: max depth
  num_parents: 1                # >1 enables crossover (DAG, shallow config merge)
  selection: ucb                # ucb | best | latest
  ucb_c: 1.0                    # exploration constant
  depth_penalty: 0.05           # penalty per unit depth
  cost_penalty: 0.0             # penalty on normalized cost (0 disables)

# ---------------------------------------------------------------------------
# 修改深度 / 源码门控（v1.1 修订）
#   说明：算子预算（max_ops_per_gen / max_code_edits_per_gen）与补丁大小上限
#   属"可做但暂不做"（见 docs/6_v5改动.md R2）；每代一个补丁由架构保证。
# ---------------------------------------------------------------------------
source_access:
  deny_deep: false              # true = deny every deep source-access request (deep surface frozen; ablation)
                                # [renamed from auto_approve, v5+] semantics: NO human approval path exists
                                # (no TTY/IPC/queue) -> this is a hard deny switch. Wiring pending (code untouched);
                                # see docs/7_遗留问题与待办.md §3.2.1.
  # ACCESS BOUNDARY is an allowlist by role, declared once in
  # gan/framework/frozen.py (single source of truth):
  #   - task      : no source access
  #   - planner   : read+write task source (t) and its own source (p)
  #   - evaluator : read task source (t, read-only) + read/write its own (e)
  # Everything not listed is frozen by default; there is no persisted deny list.
  # Denied requests are audited but their reason is not surfaced to the agent.
  max_files_per_grant: 500      # anti-blowup cap for a single grant
  max_bytes_per_grant: 52428800 # 50 MiB

# ---------------------------------------------------------------------------
# 成本（A/B 阶段已接线，docs/10 §9；钳制消费点归 C 阶段）
#   record_usage          -> 消费点：GanLoop._record_session_cost/_write_gen_cost/
#                            对账单注入（false 只停运行时落账，离线聚合器不受影响）
#   token_budget_per_gen  -> 消费点：成本对账单的参考线（B1）；
#                            消费点钳制（C）待接线，键保留
# ---------------------------------------------------------------------------
cost:
  token_budget_per_gen: 200000
  record_usage: true

# ---------------------------------------------------------------------------
# 模型：统一由 gan/framework/models.yaml + models.py 管理（本文件不再配置模型）
# feedback 信息流契约（谁可见什么）记录于 AGENTS.md / docs/6_v5改动.md，
# 断言将随三档 F1 以 smoke 形式锚定，此处不设键。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 抽题方案（消费者：gan/driver.py + gan/framework/task_execution.py）
# mode:
#   seeded        -- 每代用 (base_seed, genid) 派生的种子无放回抽题；anchor_k 题
#                    组成每代固定的配对锚核（driver 启动时一次抽取，入
#                    ckpt/sample_seed.json，resume 复用）。seed 缺省=旧行为。
#   legacy_prefix -- 固定取前 num_samples 行（历史前缀切片，A/B 基线）。
# 注：num_samples<=0（全量）时两种 mode 等价；anchor_k 被钳制在
# num_samples//2 以内，锚核永不吞掉全部预算。
# ---------------------------------------------------------------------------
sampling:
  mode: seeded
  anchor_k: 2
