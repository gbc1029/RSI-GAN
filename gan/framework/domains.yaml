# Domain registry - migrated from utils/domain_utils.py
# Resolution order for a domain name:
#   1) exact match in `domains`
#   2) longest prefix match in `families`
#   3) `default`
# Each entry is merged over `default`.
#
# Placeholders in numeric fractions are written as decimals.
#
# `task_brief`: a short, human-readable description of the task + the required
# answer interface, injected into planner/task/evaluator prompts. It states the
# task semantics and the answer vocabulary ONLY -- never the grading mechanics
# (exact match / case-insensitive / no partial credit) and never the ground-truth
# labels or scores. Marked "可解冻" (unfreezable): deliberately NOT part of the
# evolvable design for now, but a future axis.

default:
  score_key: null
  splits: [train]
  ensembled: false
  eval_subset: ""
  test_subset: ""
  stagedeval_samples: 10
  stagedeval_frac: 0.1
  has_val_subset: false
  task_brief: null
  # Per-question wall budget (seconds). Overrides loop.yaml question_timeout_s.
  # Reasoning models spend 150-350s on a SINGLE long call (observed), and one
  # question needs 2+ calls (tool use + final answer), so coding/proof domains
  # need several minutes; short-answer domains fit the 300s default.
  question_timeout_s: 300
  # Objective output contract of the task agent's answer. Used by the framework
  # (NOT by an evaluator eval point) to compute report_summary.contract_ok /
  # invalid_rate. kind: label | freeform | numeric.
  output_contract:
    kind: freeform
    allowed_labels: null
    case_insensitive: true
    strip: true

domains:
  paper_review:
    score_key: overall_accuracy
    splits: [train, val]
    ensembled: true
    eval_subset: _filtered_100_train
    test_subset: _filtered_100_test
    stagedeval_samples: 10
    stagedeval_frac: 0.1
    has_val_subset: true
    task_brief: >-
      This is peer review: read the paper and decide whether it should be
      accepted or rejected. Your final answer must be exactly one word:
      accept or reject.
    output_contract:
      kind: label
      allowed_labels: [accept, reject]
      case_insensitive: true
      strip: true

  search_arena:
    score_key: overall_accuracy
    # Same interface contract as paper_review: the task plus the required
    # answer form. The scorer matches the prediction string exactly against
    # the dataset label, so the brief MUST carry the label vocabulary
    # (model_a / model_b): without it the agent answers in prose and every
    # prediction scores 0 regardless of quality (observed: 71% correct by
    # lenient extraction, scored 0/24 as free text).
    task_brief: >-
      This is a side-by-side comparison from a chatbot arena: you are given
      one user conversation and two anonymous candidate responses, presented
      as messages_a and messages_b. Judge which response is better for the
      user and say why briefly. Your final answer must be exactly one
      identifier: model_a or model_b.
    splits: [train, val]
    ensembled: true
    eval_subset: _filtered_100_train
    test_subset: _filtered_100_test
    stagedeval_samples: 10
    stagedeval_frac: 0.1
    has_val_subset: true
    question_timeout_s: 600  # single long-form call measured at 212s

  imo_grading:
    score_key: overall_accuracy
    splits: [train, val]
    ensembled: true
    eval_subset: _filtered_100_train
    test_subset: _filtered_100_test
    stagedeval_samples: 10
    stagedeval_frac: 0.1
    question_timeout_s: 1200  # proof-grade reasoning: single call > 300s observed
    has_val_subset: true
    task_brief: >-
      Grade a student's solution to a math problem. Your final answer must be
      exactly one of: incorrect, partial, almost, correct.
    output_contract:
      kind: label
      allowed_labels: [incorrect, partial, almost, correct]
      case_insensitive: true
      strip: true

  polyglot:
    score_key: resolved_rate
    splits: [train]
    ensembled: false
    stagedeval_samples: 10
    stagedeval_frac: 0.16666666666666666
    question_timeout_s: 1200  # solve = 2-3 long calls (144-350s each observed)
    eval_task_list:
    - go__bottle-song
    - go__react
    task_brief: >-
      You get a programming exercise: its description plus skeleton files that
      are materialized into your workspace. Implement the exercise by writing
      the complete solution into every file listed under solution_paths
      (create or overwrite them with the write_file tool); leave all other
      files untouched. Keep the declared module interfaces and naming so the
      files drop into the existing project.

  imo_proof:
    score_key: points_percentage
    splits: [train]
    ensembled: false
    stagedeval_samples: 10
    stagedeval_frac: 0.16666666666666666
    question_timeout_s: 1500  # full formal proof: longest single calls
    task_brief: >-
      Write a rigorous proof for the given math problem. Your final answer is
      the proof itself.

  imo_proof_grading:
    score_key: overall_accuracy
    splits: [train]
    ensembled: false
    stagedeval_samples: 10
    stagedeval_frac: 0.16666666666666666
    question_timeout_s: 1500  # grading long proofs, same latency class
    task_brief: >-
      Grade a candidate proof against the official solution. Your final answer
      must be exactly one of: incorrect, partial, almost, correct.
    output_contract:
      kind: label
      allowed_labels: [incorrect, partial, almost, correct]
      case_insensitive: true
      strip: true

# family prefixes (longest match wins)
families:
  balrog:
    score_key: average_progress
    splits: [train]
    ensembled: false
    stagedeval_samples: 1
    stagedeval_frac: 0.1            # default for babyai; minihack overrides below
  balrog_minihack:
    stagedeval_frac: 0.2
  genesis:
    score_key: average_fitness
    splits: [train]
    ensembled: false
    stagedeval_samples: 3
    stagedeval_frac: 0.5
