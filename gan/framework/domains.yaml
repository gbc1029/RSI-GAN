# Domain registry - migrated from utils/domain_utils.py
# Resolution order for a domain name:
#   1) exact match in `domains`
#   2) longest prefix match in `families`
#   3) `default`
# Each entry is merged over `default`.
#
# Placeholders in numeric fractions are written as decimals.
#
# `task_brief`: a short, human-readable description of the task + the required
# answer interface, injected into planner/task/evaluator prompts. It states the
# task semantics and the answer vocabulary ONLY -- never the grading mechanics
# (exact match / case-insensitive / no partial credit) and never the ground-truth
# labels or scores. Marked "可解冻" (unfreezable): deliberately NOT part of the
# evolvable design for now, but a future axis.

default:
  score_key: null
  ensembled: false
  eval_subset: ""
  test_subset: ""
  # Held-out VALIDATION subset for the GAN fixed-root evaluation (docs/15
  # §12.5). Declared as the FULL dataset file stem (no extension) resolved by
  # the domain's own protocol -- CSV domains: domains/<folder>/<stem>.csv;
  # polyglot: subsets/<stem>.json. Empty = this domain has no val set (the
  # GAN loop then runs WITHOUT a val_mean, loudly). Consumed by gan/driver.py
  # (eval.subset inheritance) and task_execution._polyglot_heldout_ids (the
  # main-line pool exclusion -- a missing declaration FAILS the run for
  # pool-based domains rather than silently un-excluding the held-out ids).
  val_subset: ""
  stagedeval_samples: 10
  stagedeval_frac: 0.1
  has_val_subset: false
  task_brief: null

  # Per-question wall budget (seconds). Overrides loop.yaml question_timeout_s.
  # Reasoning models spend 150-350s on a SINGLE long call (observed), and one
  # question needs 2+ calls (tool use + final answer), so coding/proof domains
  # need several minutes; short-answer domains fit the 300s default.
  question_timeout_s: 300

  # A domain must override this with an explicit harness sandbox profile.
  # Missing/disabled profiles fail closed before the privileged broker starts.
  sandbox: null

  # Objective output contract of the task agent's answer. Used by the framework
  # (NOT by an evaluator eval point) to compute report_summary.contract_ok /
  # invalid_rate. kind: label | freeform | numeric.
  output_contract:
    kind: freeform
    allowed_labels: null
    case_insensitive: true
    strip: true

domains:
  paper_review:
    score_key: overall_accuracy
    ensembled: true
    eval_subset: _filtered_100_train
    test_subset: _filtered_100_test
    val_subset: dataset_filtered_100_val
    stagedeval_samples: 10
    stagedeval_frac: 0.1
    has_val_subset: true
    task_brief: >-
      This is peer review: read the paper and decide whether it should be
      accepted or rejected. Your final answer must be exactly one word:
      accept or reject.
    sandbox:
      enabled: true
      disabled_reason: null
      network: none
      gpu: none
      read_only_assets: []
    output_contract:
      kind: label
      allowed_labels: [accept, reject]
      case_insensitive: true
      strip: true

  search_arena:
    score_key: overall_accuracy
    # Same interface contract as paper_review: the task plus the required
    # answer form. The scorer matches the prediction string exactly against
    # the dataset label, so the brief MUST carry the label vocabulary
    # (model_a / model_b): without it the agent answers in prose and every
    # prediction scores 0 regardless of quality (observed: 71% correct by
    # lenient extraction, scored 0/24 as free text).
    task_brief: >-
      This is a side-by-side comparison from a chatbot arena: you are given
      one user conversation and two anonymous candidate responses, presented
      as messages_a and messages_b. Judge which response is better for the
      user and say why briefly. Your final answer must be exactly one
      identifier: model_a or model_b.
    ensembled: true
    eval_subset: _filtered_100_train
    test_subset: _filtered_100_test
    val_subset: dataset_filtered_100_val
    stagedeval_samples: 10
    stagedeval_frac: 0.1
    has_val_subset: true

    question_timeout_s: 600  # single long-form call measured at 212s

    sandbox:
      enabled: true
      disabled_reason: null
      network: none
      gpu: none
      read_only_assets: []


  imo_grading:
    score_key: overall_accuracy
    ensembled: true
    eval_subset: _filtered_100_train
    test_subset: _filtered_100_test
    val_subset: gradingbench_filtered_100_val
    stagedeval_samples: 10
    stagedeval_frac: 0.1
    question_timeout_s: 1200  # proof-grade reasoning: single call > 300s observed
    has_val_subset: true
    task_brief: >-
      Grade a student's solution to a math problem. Your final answer must be
      exactly one of: incorrect, partial, almost, correct.
    sandbox:
      enabled: true
      disabled_reason: null
      network: none
      gpu: none
      read_only_assets: []
    output_contract:
      kind: label
      allowed_labels: [incorrect, partial, almost, correct]
      case_insensitive: true
      strip: true

  polyglot:
    score_key: resolved_rate
    ensembled: false
    # Held-out validation ids (subsets/val.json, 18 tasks): consumed by the
    # GAN fixed-root evaluation (eval.subset inheritance) AND by the main-line
    # pool exclusion (task_execution._polyglot_heldout_ids -- never sampled
    # into the rotating main chain). Full-stem declaration, see `default`.
    val_subset: val
    stagedeval_samples: 10
    stagedeval_frac: 0.16666666666666666
    question_timeout_s: 1200  # solve = 2-3 long calls (144-350s each observed)
    # Token budgets (docs/10 §10) -- polyglot values from the 2-question smoke
    # calibration (runs/<gen>/cost.json, glm-5.3-flash): per-question median
    # ~140k, max 440k observed -> 300k clips only the outlier; gen line =
    # 5 samples x 300k. token_budget_per_question is the child's token SOFT
    # STOP (injected into the reserved design cost slot pre-persist, min with
    # any design-declared value, clamped by the gen ceiling); token_budget_per_gen
    # overrides the loop.yaml global (cost.token_budget_per_gen) as the
    # cost-statement reference line AND the clamp ceiling. Re-calibrate after
    # the first full-pool run (the smoke measured ONE pinned question pair).
    token_budget_per_question: 300000
    token_budget_per_gen: 1500000
    # Candidate pool (Arch 2), two modes -- selected by prepare_polyglot_questions:
    # - FULL pool (default: eval_task_list absent/empty): all metadata
    #   instances (225, across go/rust/cpp/java/javascript/python) are
    #   candidates. With gan/framework/loop.yaml sampling.mode=seeded the
    #   runner draws --num_samples of them uniformly at random PER GENERATION
    #   (per-gen seed derived from ckpt/sample_seed.json: every generation
    #   rotates questions, resume reproduces the exact draw; loop.yaml
    #   sampling.base_seed fixes the draw across ablation arms). Legacy
    #   sampling (mode != seeded) keeps the metadata-order prefix of the pool
    #   -- react + bottle-song, the historical 2-task pair.
    # - PINNED pool (eval_task_list non-empty): candidates are filtered to
    #   THIS list first; use it for single-language smoke runs so the first
    #   eval reuses the already-built pb.env.x86_64.<hash> env image
    #   (per-task pb.eval.x86_64.<task> images build lazily on first eval).
    #   INVARIANT: len >= --num_samples, enforced fail-fast at DomainTaskRunner
    #   init (full-pool mode is checked against the metadata size likewise).
    # eval_task_list: [go__bottle-song, go__react, go__dominoes,
    #                  go__crypto-square, go__book-store]
    task_brief: >-

      You get a programming exercise: its description plus skeleton files that
      are materialized into your workspace. Implement the exercise by writing
      the complete solution into every file listed under solution_paths
      (create or overwrite them with the write_file tool); leave all other
      files untouched. Keep the declared module interfaces and naming so the
      files drop into the existing project.


    sandbox:
      enabled: true
      disabled_reason: null
      network: none
      gpu: none
      read_only_assets: []


  imo_proof:
    score_key: points_percentage
    ensembled: false
    stagedeval_samples: 10
    stagedeval_frac: 0.16666666666666666
    harness_num_workers: 1  # serialize upstream calls in generation + proof grading
    question_timeout_s: 900  # full formal proof: longest single calls
    harness_timeout_s: 7200  # split into two 19500s stages: 10 serial questions + overhead
    task_brief: >-
      Write a rigorous proof for the given math problem. Your final answer is
      the proof itself.
    sandbox:
      enabled: true
      disabled_reason: null
      network: none
      gpu: none
      read_only_assets: [domains/imo]

  imo_proof_grading:
    score_key: overall_accuracy
    ensembled: false
    stagedeval_samples: 10
    stagedeval_frac: 0.16666666666666666
    question_timeout_s: 1800  # grading long proofs, same latency class
    task_brief: >-
      Grade a candidate proof against the official solution. Your final answer
      must be exactly one of: incorrect, partial, almost, correct.
    output_contract:
      kind: label
      allowed_labels: [incorrect, partial, almost, correct]
      case_insensitive: true
      strip: true
    sandbox:
      enabled: false
      disabled_reason: GAN does not provide the required proofs_dname input
      network: none
      gpu: none
      read_only_assets: [domains/imo]

  balrog_babyai:
    harness_timeout_s: 3600
    task_brief: >-
      Play the BabyAI navigation environment. At each step, inspect the mission
      and observation and respond with exactly one valid environment action.

  balrog_babaisai:
    question_timeout_s: 600
    harness_timeout_s: 7200
    task_brief: >-
      Play the Baba Is AI puzzle environment. At each step, inspect the active
      rules and object positions and respond with exactly one valid action.

# family prefixes (longest match wins)
families:
  balrog:
    score_key: average_progress
    ensembled: false
    stagedeval_samples: 1
    stagedeval_frac: 0.1            # default for babyai; minihack overrides below
    sandbox:
      enabled: true
      disabled_reason: null
      network: none
      gpu: none
      read_only_assets: []
  balrog_minihack:
    stagedeval_frac: 0.2
    # resolve_domain selects only the longest family prefix, so repeat the
    # balrog sandbox contract for this more-specific family.
    sandbox:
      enabled: true
      disabled_reason: null
      network: none
      gpu: none
      read_only_assets: []
  genesis:
    score_key: average_fitness
    ensembled: false
    stagedeval_samples: 3
    stagedeval_frac: 0.5
    sandbox:
      enabled: false
      disabled_reason: WSL CUDA device exposure is not configured or verified
      network: none
      gpu: wsl_cuda
      read_only_assets: []
