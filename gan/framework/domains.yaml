# Domain registry - migrated from utils/domain_utils.py
# Resolution order for a domain name:
#   1) exact match in `domains`
#   2) longest prefix match in `families`
#   3) `default`
# Each entry is merged over `default`.
#
# Placeholders in numeric fractions are written as decimals.
#
# `task_brief`: a short, human-readable description of the task + the required
# answer interface, injected into planner/task/evaluator prompts. It states the
# task semantics and the answer vocabulary ONLY -- never the grading mechanics
# (exact match / case-insensitive / no partial credit) and never the ground-truth
# labels or scores. Marked "可解冻" (unfreezable): deliberately NOT part of the
# evolvable design for now, but a future axis.

default:
  score_key: null
  ensembled: false
  eval_subset: ""
  test_subset: ""
  # Held-out VALIDATION subset for the GAN fixed-root evaluation (docs/15
  # §12.5). Declared as the FULL dataset file stem (no extension) resolved by
  # the domain's own protocol -- CSV domains: domains/<folder>/<stem>.csv;
  # polyglot: subsets/<stem>.json. Empty = this domain has no val set (the
  # GAN loop then runs WITHOUT a val_mean, loudly). Consumed by gan/driver.py
  # (eval.subset inheritance) and task_execution._polyglot_heldout_ids (the
  # main-line pool exclusion -- a missing declaration FAILS the run for
  # pool-based domains rather than silently un-excluding the held-out ids).
  val_subset: ""
  stagedeval_samples: 10
  stagedeval_frac: 0.1
  has_val_subset: false
  task_brief: null

  # Per-question wall budget (seconds). Overrides loop.yaml question_timeout_s.
  # Reasoning models spend 150-350s on a SINGLE long call (observed), and one
  # question needs 2+ calls (tool use + final answer), so coding/proof domains
  # need several minutes; short-answer domains fit the 300s default.
  question_timeout_s: 300

  # A domain must override this with an explicit harness sandbox profile.
  # Missing/disabled profiles fail closed before the privileged broker starts.
  sandbox: null

  # Objective output contract of the task agent's answer. Used by the framework
  # (NOT by an evaluator eval point) to compute report_summary.contract_ok /
  # invalid_rate. kind: label | freeform | numeric.
  output_contract:
    kind: freeform
    allowed_labels: null
    case_insensitive: true
    strip: true

domains:
  paper_review:
    score_key: overall_accuracy
    ensembled: true
    eval_subset: _filtered_100_train
    test_subset: _filtered_100_test
    val_subset: dataset_filtered_100_val
    stagedeval_samples: 10
    stagedeval_frac: 0.1
    has_val_subset: true
    task_brief: >-
      This is peer review: read the paper and decide whether it should be
      accepted or rejected. Your final answer must be exactly one word:
      accept or reject.
    sandbox:
      enabled: true
      disabled_reason: null
      network: none
      gpu: none
      read_only_assets: []
    output_contract:
      kind: label
      allowed_labels: [accept, reject]
      case_insensitive: true
      strip: true

  search_arena:
    score_key: overall_accuracy
    # Same interface contract as paper_review: the task plus the required
    # answer form. The scorer matches the prediction string exactly against
    # the dataset label, so the brief MUST carry the label vocabulary
    # (model_a / model_b): without it the agent answers in prose and every
    # prediction scores 0 regardless of quality (observed: 71% correct by
    # lenient extraction, scored 0/24 as free text).
    task_brief: >-
      This is a side-by-side comparison from a chatbot arena: you are given
      one user conversation and two anonymous candidate responses, presented
      as messages_a and messages_b. Judge which response is better for the
      user and say why briefly. Your final answer must be exactly one
      identifier: model_a or model_b.
    # Filled 2026-10-30 (F4/C1): the scorer IS an exact label match on this
    # vocabulary, so the contract is a label contract like paper_review — the
    # derived response contract names the same words (compute_report_summary
    # additionally gains contract_ok for search runs; measurement only).
    output_contract:
      kind: label
      allowed_labels: [model_a, model_b]
      case_insensitive: true
      strip: true
    ensembled: true
    eval_subset: _filtered_100_train
    test_subset: _filtered_100_test
    val_subset: dataset_filtered_100_val
    stagedeval_samples: 10
    stagedeval_frac: 0.1
    has_val_subset: true

    question_timeout_s: 600  # single long-form call measured at 212s

    sandbox:
      enabled: true
      disabled_reason: null
      network: none
      gpu: none
      read_only_assets: []


  imo_grading:
    score_key: overall_accuracy
    ensembled: true
    eval_subset: _filtered_100_train
    test_subset: _filtered_100_test
    val_subset: gradingbench_filtered_100_val
    stagedeval_samples: 10
    stagedeval_frac: 0.1
    question_timeout_s: 1200  # proof-grade reasoning: single call > 300s observed
    has_val_subset: true
    task_brief: >-
      Grade a student's solution to a math problem. Your final answer must be
      exactly one of: incorrect, partial, almost, correct.
    sandbox:
      enabled: true
      disabled_reason: null
      network: none
      gpu: none
      read_only_assets: []
    output_contract:
      kind: label
      allowed_labels: [incorrect, partial, almost, correct]
      case_insensitive: true
      strip: true

  polyglot:
    score_key: resolved_rate
    ensembled: false
    # Held-out validation ids (subsets/val.json, 18 tasks): consumed by the
    # GAN fixed-root evaluation (eval.subset inheritance) AND by the main-line
    # pool exclusion (task_execution._polyglot_heldout_ids -- never sampled
    # into the rotating main chain). Full-stem declaration, see `default`.
    val_subset: val
    stagedeval_samples: 10
    stagedeval_frac: 0.16666666666666666
    question_timeout_s: 1200  # solve = 2-3 long calls (144-350s each observed)
    # Token budgets (docs/10 §10) -- polyglot values from the 2-question smoke
    # calibration (runs/<gen>/cost.json, glm-5.3-flash): per-question median
    # ~140k, max 440k observed -> 300k clips only the outlier; gen line =
    # 5 samples x 300k. token_budget_per_question is the child's token SOFT
    # STOP (injected into the reserved design cost slot pre-persist, min with
    # any design-declared value, clamped by the gen ceiling); token_budget_per_gen
    # overrides the loop.yaml global (cost.token_budget_per_gen) as the
    # cost-statement reference line AND the clamp ceiling. Re-calibrate after
    # the first full-pool run (the smoke measured ONE pinned question pair).
    token_budget_per_question: 300000
    token_budget_per_gen: 1500000
    # Candidate pool (Arch 2), two modes -- selected by prepare_polyglot_questions:
    # - FULL pool (default: eval_task_list absent/empty): all metadata
    #   instances (225, across go/rust/cpp/java/javascript/python) are
    #   candidates. With gan/framework/loop.yaml sampling.mode=seeded the
    #   runner draws --num_samples of them uniformly at random PER GENERATION
    #   (per-gen seed derived from ckpt/sample_seed.json: every generation
    #   rotates questions, resume reproduces the exact draw; loop.yaml
    #   sampling.base_seed fixes the draw across ablation arms). Legacy
    #   sampling (mode != seeded) keeps the metadata-order prefix of the pool
    #   -- react + bottle-song, the historical 2-task pair.
    # - PINNED pool (eval_task_list non-empty): candidates are filtered to
    #   THIS list first; use it for single-language smoke runs so the first
    #   eval reuses the already-built pb.env.x86_64.<hash> env image
    #   (per-task pb.eval.x86_64.<task> images build lazily on first eval).
    #   INVARIANT: len >= --num_samples, enforced fail-fast at DomainTaskRunner
    #   init (full-pool mode is checked against the metadata size likewise).
    # eval_task_list: [go__bottle-song, go__react, go__dominoes,
    #                  go__crypto-square, go__book-store]
    task_brief: >-

      You get a programming exercise: its description plus skeleton files that
      are materialized into your workspace. Implement the exercise by writing
      the complete solution into every file listed under solution_paths
      (create or overwrite them with the write_file tool); leave all other
      files untouched. Keep the declared module interfaces and naming so the
      files drop into the existing project.


    sandbox:
      enabled: true
      disabled_reason: null
      network: none
      gpu: none
      read_only_assets: []


  imo_proof:
    score_key: points_percentage
    ensembled: false
    stagedeval_samples: 10
    stagedeval_frac: 0.16666666666666666
    harness_num_workers: 5  # serialize upstream calls in generation + proof grading
    question_timeout_s: 900  # full formal proof: longest single calls
    harness_timeout_s: 7200  # split into two 19500s stages: 10 serial questions + overhead
    task_brief: >-
      Write a rigorous proof for the given math problem. Your final answer is
      the proof itself.
    sandbox:
      enabled: true
      disabled_reason: null
      network: none
      gpu: none
      read_only_assets: [domains/imo]

  imo_proof_grading:
    score_key: overall_accuracy
    ensembled: false
    stagedeval_samples: 10
    stagedeval_frac: 0.16666666666666666
    question_timeout_s: 1800  # grading long proofs, same latency class
    task_brief: >-
      Grade a candidate proof against the official solution. Your final answer
      must be exactly one integer score from 0 through 7.
    output_contract:
      kind: label
      allowed_labels: ["0", "1", "2", "3", "4", "5", "6", "7"]
      case_insensitive: true
      strip: true
    sandbox:
      enabled: false
      disabled_reason: GAN does not provide the required proofs_dname input
      network: none
      gpu: none
      read_only_assets: [domains/imo]

  # Balrog game domains. ONE harness launch is not "one session per question":
  # it runs (#tasks in domains/balrog/config/config.yaml) episodes per
  # ``--num-samples`` unit and EVERY STEP is a separate sandboxed agent session
  # with its own LLM call chain. The per-question wall/call defaults therefore
  # cannot express the real load, so both budgets are declared PER
  # ``--num-samples`` UNIT (all tasks' episodes at that episode count):
  #   * harness_timeout_per_sample_s -> task_execution.harness_total_timeout
  #   * task_llm_calls_per_sample    -> task_execution.task_llm_call_budget
  # (the task proxy token is a HARD cap: exhausting it kills the step child,
  # the harness exits non-zero and -- for the two sandboxed balrog domains -- no
  # report is written at all, i.e. a null score that looks like bad play).
  # Task counts / episode lengths below are MEASURED (2026-11-03), not guessed:
  # `len(cfg.tasks.<env>_tasks)` and `EnvWrapper.max_steps` after reset.
  balrog_babyai:
    # 5 tasks; BabyAI-MixedTrainLocal samples a sub-task per episode and its
    # max_steps is 64 (goto/pickup) or 128 (open/putnext/pick_up_seq_go_to) --
    # the 64/128 split was re-measured on full-length rounds 2026-11-10, where
    # `open` ran to the 128 cap in BOTH arms (the earlier note claimed 64 for
    # open; the budgets below already assumed the worst case, so nothing
    # functional changes). Worst case:
    # 5 x 128 steps x 20s = 12800s per unit; 5 x 128 x 4 calls = 2560 calls.
    harness_timeout_per_sample_s: 12800
    task_llm_calls_per_sample: 2560
    # PARALLEL EPISODES (P2-16). Every ENV STEP is its own sandboxed child, so
    # this is a namespace-tree budget, not a thread count: babyai is 5 tasks x
    # <=128 steps and was measured at ~10s/step, so two concurrent episodes is
    # the smallest useful parallelism that still leaves the host headroom. The
    # value crosses as `domains.harness --episode_workers` and the harness takes
    # min(that, --num_workers); a domain that declares NOTHING stays at 1.
    harness_episode_workers: 2
    # Aborted-round guard -- see the generic `balrog` family below. REPEATED
    # here on purpose: resolve_domain picks the LONGEST prefix only, so a
    # concrete family never inherits the generic one's keys.
    max_aborted_ratio: 0.25
    # CROSS-STEP MEMORY (方案 a): 16 messages = the last 8 steps, the upstream
    # default. Measured prompt cost on this domain: +~1.1KB / +275 tokens per
    # step (+14% on the 2032-char step prompt).
    history_messages: 16
    history_max_chars: 4000
    # EPISODE PLAN (the balrog analogue of paper_review's question sampling):
    # a balrog "question" is one EPISODE, so the anchor core is a frozen list of
    # (task, episode seed) pairs -- `<task>#<seed>` in ckpt/sample_seed.json --
    # drawn by task_execution.ensure_sampling_seed from THIS list. The balrog
    # harness refuses a plan whose task is absent from
    # domains/balrog/config/config.yaml (fail-closed: the two lists must not
    # drift silently). ``anchor_episodes_per_task: auto`` = min(n, max(1, n//2))
    # -- the paper_review "half the budget stays paired" rule with a floor of
    # one; 0 disables the plan and restores the historical random seeds.
    episode_tasks:
      - "BabyAI-MixedTrainLocal-v0/goto"
      - "BabyAI-MixedTrainLocal-v0/pickup"
      - "BabyAI-MixedTrainLocal-v0/open"
      - "BabyAI-MixedTrainLocal-v0/putnext"
      - "BabyAI-MixedTrainLocal-v0/pick_up_seq_go_to"
    anchor_episodes_per_task: auto
    # FIXED-ROOT EVALUATION (第三层：docs/14 §5.5 的 episode 版). 一个 question =
    # 一个 episode，所以"固定评估题集"= 一份冻结的 (task, seed) 列表：
    # `eval_episodes_per_task` 个 episode / task，用 `EVAL_KIND` 从 run base seed
    # 派生，跨 outer / 跨 supernode 完全相同 ⇒ sibling 可比。落地在
    # ckpt/sample_seed.json 的 `eval_episode_ids`，由 root 侧 broker 在
    # `eval_outer*` scope 里当作 anchor 列表下发（plan_episodes 先填 anchor，
    # 所以整轮没有轮换槽）；结果写 benchmark.val_mean（不覆盖主线 mean）。
    # 代价：每轮评估 = 5 task x N episode x (≤128 step)。N=1 已经是一个完整
    # 生成的数量级 ⇒ 默认 1，要更细就抬 loop.yaml eval.episodes_per_task 或这里。
    eval_episodes_per_task: 1
    # OUTPUT CONTRACT (P1-9). A balrog prediction is ONE environment action per
    # step, so the requirement is expressed structurally instead of falling back
    # to the universal "return your final answer" sentence: the labelled
    # vocabulary below is `language_action_space`
    # (`domains/balrog/environments/babyai_text/clean_lang_wrapper.py:4`), and
    # `contract_ok` then means "every step produced a legal action" -- which is
    # what makes `issue_checks.design.contract-format` decidable for this domain.
    # The offline guard test asserts this list matches the env's own vocabulary.
    output_contract:
      kind: action
      allowed_labels:
        - "turn left"
        - "turn right"
        - "go forward"
        - "pick up"
        - "drop"
        - "toggle"
    task_brief: >-
      Play the BabyAI navigation environment. At each step, inspect the mission
      and observation and respond with exactly one valid environment action.

  balrog_babaisai:
    question_timeout_s: 600
    # 40 tasks (config.yaml babaisai_tasks) x 100 steps (baba env max_steps).
    # That is 4000 agent sessions PER unit: 40 x 100 x 10s = 40000s (~11h) and
    # 40 x 100 x 4 = 16000 calls. This is genuinely expensive -- an operator who
    # wants a cheaper generation must trim babaisai_tasks or pin
    # eval.max_steps_per_episode for the run (neither is silently changed here).
    harness_timeout_per_sample_s: 40000
    task_llm_calls_per_sample: 16000
    # PARALLEL EPISODES (P2-16): stays at ONE. babaisai is 40 tasks x 100 steps
    # per unit (~4000 step children), so the pressure is already an order of
    # magnitude above babyai; raising this needs a measured round first (see
    # README "成本"), not an optimistic guess.
    harness_episode_workers: 1
    # Aborted-round guard -- see the generic `balrog` family (repeated because
    # this family SHADOWS it: longest-prefix resolution only).
    max_aborted_ratio: 0.25
    # CROSS-STEP MEMORY (方案 a): ON at the same depth as babyai (16 messages =
    # the last 8 steps). The babyai A/B this key was waiting for is DONE
    # (2026-11-10, `scripts/local/run_full_arm.sh`, both arms on the SAME frozen
    # 5-episode eval plan): 1/5 solved vs 0/5 for the OFF arm, and the decisive
    # difference was qualitative -- the window used toggle/pickup (75 of 397
    # steps) while the OFF arm used NO interaction action AT ALL in 384 steps
    # (only turn-left/turn-right/go-forward, ~1/3 each). baba is the same env
    # family and the same agent, so the mechanism ("am I already facing / have I
    # already toggled this") transfers; `history_max_chars` keeps the cost of
    # long baba observations bounded (4000 chars, oldest steps dropped first).
    # 0 disables the window and restores the byte-identical pre-window prompt.
    history_messages: 16
    history_max_chars: 4000
    # Episode plan -- see balrog_babyai above. 40 tasks (config.yaml
    # babaisai_tasks), so at num_samples=2 this freezes 40 anchor episodes and
    # rotates 40 per generation.
    episode_tasks:
      - "env/make_win-distr_obj_rule"
      - "env/goto_win-distr_obj_rule"
      - "env/goto_win"
      - "env/goto_win-distr_obj"
      - "env/goto_win-distr_rule"
      - "env/goto_win-distr_obj-irrelevant_rule"
      - "env/make_win-distr_obj"
      - "env/make_win-distr_rule"
      - "env/make_win"
      - "env/make_win-distr_obj-irrelevant_rule"
      - "env/two_room-goto_win"
      - "env/two_room-goto_win-distr_obj_rule"
      - "env/two_room-goto_win-distr_rule"
      - "env/two_room-goto_win-distr_obj"
      - "env/two_room-goto_win-distr_obj-irrelevant_rule"
      - "env/two_room-goto_win-distr_win_rule"
      - "env/two_room-break_stop-goto_win-distr_obj_rule"
      - "env/two_room-break_stop-goto_win-distr_obj"
      - "env/two_room-break_stop-goto_win-distr_rule"
      - "env/two_room-break_stop-goto_win-distr_obj-irrelevant_rule"
      - "env/two_room-break_stop-goto_win"
      - "env/two_room-maybe_break_stop-goto_win-distr_obj_rule"
      - "env/two_room-maybe_break_stop-goto_win"
      - "env/two_room-maybe_break_stop-goto_win-distr_obj"
      - "env/two_room-maybe_break_stop-goto_win-distr_rule"
      - "env/two_room-maybe_break_stop-goto_win-distr_obj-irrelevant_rule"
      - "env/two_room-make_win-distr_obj_rule"
      - "env/two_room-make_win-distr_rule"
      - "env/two_room-make_win"
      - "env/two_room-make_win-distr_obj-irrelevant_rule"
      - "env/two_room-make_win-distr_obj"
      - "env/two_room-make_win-distr_win_rule"
      - "env/two_room-break_stop-make_win-distr_obj_rule"
      - "env/two_room-break_stop-make_win-distr_rule"
      - "env/two_room-break_stop-make_win"
      - "env/two_room-break_stop-make_win-distr_obj-irrelevant_rule"
      - "env/two_room-break_stop-make_win-distr_obj"
      - "env/two_room-make_you"
      - "env/two_room-make_you-make_win"
      - "env/two_room-make_wall_win"
    anchor_episodes_per_task: auto
    # 固定根评估：见 balrog_babyai 上方。40 tasks x N episodes x 100 steps，N=1 已
    # = 4000 步 / 轮（比 babyai 贵一个量级），所以默认 1 且只在
    # outer_select.enabled 时才会跑；运营者要更大评估集请显式抬这里或
    # loop.yaml eval.episodes_per_task。
    eval_episodes_per_task: 1
    # OUTPUT CONTRACT (P1-9): see balrog_babyai above. Vocabulary =
    # `BABAISAI_ACTION_SPACE` (`domains/balrog/environments/babaisai/base.py:9`,
    # `[a.name for a in baba.grid.BabaIsYouEnv.Actions]`, measured
    # 2026-11-05: idle/up/right/down/left).
    output_contract:
      kind: action
      allowed_labels:
        - "idle"
        - "up"
        - "right"
        - "down"
        - "left"
    task_brief: >-
      Play the Baba Is AI puzzle environment. At each step, inspect the active
      rules and object positions and respond with exactly one valid action.

# family prefixes (longest match wins)
families:
  balrog:
    score_key: average_progress
    # CROSS-STEP MEMORY (方案 a, 2026-11-10). Upstream kept the last
    # ``agent.max_text_history`` MESSAGES in the LLM conversation; a step child
    # here is a fresh process, so ``Evaluator._play_episode`` re-renders that
    # window into every step's payload (key ``history``). Unit = messages (one
    # step = observation + action = 2), so 16 = the last 8 steps.
    # ``history_messages: 0`` turns the window OFF and makes the prompt
    # byte-identical to the pre-window behaviour (the A/B switch).
    # ``history_max_chars`` caps the rendered block; oldest steps drop first.
    history_messages: 16
    history_max_chars: 4000
    # ABORTED-ROUND GUARD (P2-16b). An aborted episode is scored 0.0 (a played
    # and lost episode), so an infrastructure failure that kills part of the
    # round silently depresses the mean. Above this share of the played episodes,
    # ``task_runner`` VOIDS the score (score: null + ``task_round_degraded``
    # event + ``invalid_reason``) instead of letting the lineage record a
    # fabricated result. The report stays on disk for forensics. Undeclared =
    # off, which is why every question domain is unaffected.
    max_aborted_ratio: 0.25
    # REPORT SCALE (P1-7): the balrog harness reports `average_progress` as a
    # 0-100 PERCENTAGE while every other domain scores 0-1. This is DECLARED here
    # (inherited by every balrog domain) instead of being hard-coded as a domain
    # SET inside `task_execution.extract_score`, which silently left any domain
    # added later on the wrong scale.
    score_divisor: 100
    ensembled: false
    stagedeval_samples: 1
    stagedeval_frac: 0.1            # default for babyai; minihack overrides below
    sandbox:
      enabled: true
      disabled_reason: null
      network: none
      gpu: none
      read_only_assets: []
  balrog_minihack:
    # NOT WIRED (P1-8): the upstream config declares minihack tasks and the
    # harness argparse still accepts the name, but there is no entry in
    # `domains/harness.py:_SANDBOXED_BALROG_MODULES`, no per-domain section below,
    # and no installer path. `task_execution.domain_runnable_error` REFUSES the
    # driver run until all three exist; wiring it needs NLE (C extension + ~2GB
    # game data) first.
    # NOTE: resolution picks the LONGEST matching prefix ONLY, so this family
    # SHADOWS `balrog` -- every key the generic family carries must be repeated
    # here (score_key/score_divisor were silently missing before 2026-11-05).
    score_key: average_progress
    score_divisor: 100
    stagedeval_frac: 0.2
    # resolve_domain selects only the longest family prefix, so repeat the
    # balrog sandbox contract for this more-specific family.
    sandbox:
      enabled: true
      disabled_reason: null
      network: none
      gpu: none
      read_only_assets: []
  balrog_nle:
    # NOT WIRED (P1-8) -- same reason as balrog_minihack. Declared explicitly so
    # "which balrog domains exist and which are usable" has ONE answer in the
    # registry (it previously fell through to the plain `balrog` family and
    # looked supported). Keys repeated for the same shadowing reason.
    score_key: average_progress
    score_divisor: 100
    sandbox:
      enabled: true
      disabled_reason: null
      network: none
      gpu: none
      read_only_assets: []
  genesis:
    score_key: average_fitness
    ensembled: false
    stagedeval_samples: 3
    stagedeval_frac: 0.5
    sandbox:
      enabled: false
      disabled_reason: WSL CUDA device exposure is not configured or verified
      network: none
      gpu: wsl_cuda
      read_only_assets: []
