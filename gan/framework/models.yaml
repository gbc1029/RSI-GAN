# Single source of truth for model selection (FRAMEWORK, frozen).
#
# There is NO precedence chain, NO environment overrides and NO fallback model.
# A model is selected by its ROLE KEY only, and the resolved value is passed
# explicitly at runtime (e.g. domains/harness `--model`).
#
# Part 1 - GAN roles
# Part 2 - DGM-H roles
# Part 3 - domain-specific (non-task) roles
gan:
  task: openai/glm-5.3-flash
  planner: openai/glm-5.3-flash
  evaluator: openai/glm-5.3-flash

dgmh:
  meta: openai/claude-sonnet-4-5-20250929
  task: openai/gpt-4o-mini

domains:
  # external aider CLI used by the polyglot benchmark tooling (not our agent)
  polyglot_aider: gpt-3.5-turbo
